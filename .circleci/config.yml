version: 2.1

commands:
  get-tag:
    steps:
      - run:
          name: Create Tag Environment Variable
          command: |
              SHORT_SHA=${CIRCLE_SHA1:0:7}
              TAG="1.0-<< pipeline.number >>-${SHORT_SHA}"

              echo "export TAG='$TAG'" >> "$BASH_ENV"
              source $BASH_ENV
              echo $TAG

jobs:
  build-image:
    machine: true
    resource_class: logan/machine_medium 
    steps:
      - checkout
      - get-tag
      - run:
          name: Docker Build
          command: |
            docker build -t imlogang/web-ui:$TAG .
      - run: 
          name: Docker Login
          command: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
      - run:
          name: Docker Push
          command: |
            docker push imlogang/web-ui:$TAG

  deploy-web-ui:
    resource_class: logan/container-runner
    docker:
      - image: dockerregistry.logangodsey.com/toolbox:124-bbb90
    steps:
      - checkout
      - get-tag
      - run: 
          name: Helm Upgrade
          command: |
            helm upgrade --install --debug web-ui ./deploy --set image.tag=${TAG} --set circleci.pipelineId=<< pipeline.id >> --set circleci.workflowId=${CIRCLE_WORKFLOW_ID} --set-string circleci.jobNumber=${CIRCLE_BUILD_NUM} -n web-ui -f values.yaml
      - run: 
          name: Watch release
          command: |
            circleci run release plan --environment-name="Microk8s Cluster" --component-name="web-ui" --target-version="${TAG}" --namespace="web-ui" web-ui

  release-web-ui:
    type: release
    plan_name: web-ui

workflows:
  build-and-deploy-web-ui:
    jobs:
      - build-image:
          context:
            - docker_stuff
      - deploy-web-ui:
          requires:
            - build-image
          serial-group: << pipeline.project.slug >>/deploy-group
          filters:
            branches:
              only:
                - main
      - release-web-ui:
          requires:
            - deploy-web-ui
          filters:
            branches:
              only:
                - main
